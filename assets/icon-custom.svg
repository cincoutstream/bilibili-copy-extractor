<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B站文案提取">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7299"/>
      <stop offset="100%" stop-color="#FF9BB6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 天线 -->
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round">
    <line x1="206" y1="162" x2="176" y2="110"/>
    <line x1="306" y1="162" x2="336" y2="110"/>
  </g>
  <circle cx="176" cy="110" r="14" fill="#FFFFFF"/>
  <circle cx="336" cy="110" r="14" fill="#FFFFFF"/>

  <!-- 电视机身 -->
  <rect x="118" y="156" width="276" height="230" rx="34" fill="#FFFFFF"/>

  <!-- 字幕线（代表提取出的文案） -->
  <rect x="162" y="212" width="196" height="26" rx="13" fill="#00A1D6"/>
  <rect x="162" y="264" width="156" height="24" rx="12" fill="#8FC9E2"/>
  <rect x="162" y="314" width="200" height="24" rx="12" fill="#E03E6B"/>
</svg>
